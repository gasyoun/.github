name: Feature request
description: A capability that does not exist yet
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The task that is hard today, not the proposed implementation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Optional; one paragraph is enough
  - type: textarea
    id: alternatives
    attributes:
      label: What exists already
      description: Prior art in this account or upstream, if you checked
